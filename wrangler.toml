name = "os-neuavenue"
main = "worker.js"
compatibility_date = "2026-08-25"
workers_dev = true

# Static site plus a tiny Worker for /api/config (Supabase public keys
# come from Cloudflare secrets — not from this repo).
[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Attach only the canonical hostname. Alias neuos.neuavenue.com in DNS
# as CNAME → os.neuavenue.com after this custom domain exists.
# Do not also custom_domain neuos while a manual CNAME already exists
# (Wrangler error 100117).
[[routes]]
pattern = "os.neuavenue.com"
custom_domain = true
