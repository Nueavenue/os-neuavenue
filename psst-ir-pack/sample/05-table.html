<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sample · Table</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#ECE3D2;--ink:#14181D;--ink-soft:#4A4D52;--ember:#BC4F2B;--line:rgba(20,24,29,.16);}
body{margin:0;overflow:hidden;font-family:Inter,'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);}
p{margin:0;}
table{border-collapse:collapse;width:100%;}
th{background:var(--ink);color:var(--paper);text-align:left;padding:14px 18px;font-size:18px;}
td{padding:16px 18px;border-bottom:1px solid var(--line);font-size:22px;vertical-align:top;}
</style></head>
<body>
<div class="slide-container" style="position:relative;width:1920px;height:1080px;background:var(--paper);">
  <p style="position:absolute;left:96px;top:64px;font-size:16px;font-weight:700;letter-spacing:.14em;color:var(--ember);">SAMPLE · COMPARISON TABLE</p>
  <h1 style="position:absolute;left:96px;top:110px;margin:0;font-size:44px;font-weight:800;">Compare without inventing numbers</h1>
  <div style="position:absolute;left:96px;top:240px;width:1728px;">
    <table>
      <tr><th style="width:28%;">Axis</th><th>Pattern A</th><th>Pattern B</th></tr>
      <tr><td><b>Unit</b></td><td>App / tab</td><td>Seat / session</td></tr>
      <tr><td><b>Claim style</b></td><td>Feature list</td><td>Category lock</td></tr>
      <tr><td><b>Edit rule</b></td><td>Rewrite whole slide</td><td>Surgical ops only</td></tr>
      <tr><td><b>Demo content</b></td><td colspan="2">Placeholder rows — replace in your own pack</td></tr>
    </table>
  </div>
</div>
</body></html>
