<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sample · Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#ECE3D2;--paper-soft:#F4EEE1;--ink:#14181D;--ink-soft:#4A4D52;--ember:#BC4F2B;--line:rgba(20,24,29,.16);}
body{margin:0;overflow:hidden;font-family:Inter,'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);}
p{margin:0;}
</style></head>
<body>
<div class="slide-container" style="position:relative;width:1920px;height:1080px;background:var(--paper);">
  <p style="position:absolute;left:96px;top:64px;font-size:16px;font-weight:700;letter-spacing:.14em;color:var(--ember);">SAMPLE · SLIDEV / MARP PAPER GRID</p>
  <h1 style="position:absolute;left:96px;top:110px;margin:0;font-size:44px;font-weight:800;">Four equal modules</h1>
  <div style="position:absolute;left:96px;top:240px;width:840px;height:320px;background:var(--paper-soft);border:1px solid var(--line);padding:28px;box-sizing:border-box;">
    <p style="font-size:22px;font-weight:800;">A · Title slot</p>
    <p style="margin-top:12px;font-size:20px;color:var(--ink-soft);">Keep hierarchy: eyebrow → H1 → body.</p>
  </div>
  <div style="position:absolute;left:984px;top:240px;width:840px;height:320px;background:var(--paper-soft);border:1px solid var(--line);padding:28px;box-sizing:border-box;">
    <p style="font-size:22px;font-weight:800;">B · Body slot</p>
    <p style="margin-top:12px;font-size:20px;color:var(--ink-soft);">One idea per box. No dense OS claims.</p>
  </div>
  <div style="position:absolute;left:96px;top:600px;width:840px;height:320px;background:var(--paper-soft);border:1px solid var(--line);padding:28px;box-sizing:border-box;">
    <p style="font-size:22px;font-weight:800;">C · Proof slot</p>
    <p style="margin-top:12px;font-size:20px;color:var(--ink-soft);">SHIPPED / EARLY / TARGET chips only when true.</p>
  </div>
  <div style="position:absolute;left:984px;top:600px;width:840px;height:320px;background:var(--ink);padding:28px;box-sizing:border-box;">
    <p style="font-size:22px;font-weight:800;color:#E8A37E;">D · Contrast slot</p>
    <p style="margin-top:12px;font-size:20px;color:var(--paper);">Ink panel for emphasis — still paper system.</p>
  </div>
</div>
</body></html>
